name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage
      - run: npm run typecheck
      - run: npm run verify:package
      - run: npm run protocol:generate && npm run probe:swift:generate && git diff --exit-code -- protocol
      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  sonar:
    needs: typescript
    # Enable after importing the Cloud project and adding SONAR_TOKEN.
    # Fork pull requests cannot access the analysis token.
    if: >-
      vars.SONAR_PROJECT_KEY != '' && vars.SONAR_ORGANIZATION != '' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
